[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "umbra-osint"
version = "0.2.0"
description = "Navaja suiza OSINT con menú: dorks, IMINT, SOCMINT y recon pasivo."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "umbyx-ai" }]
keywords = ["osint", "reconnaissance", "cybersecurity", "imint", "socmint", "google-dorks", "shodan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "rich>=13.7",
    "pillow>=11.0",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/umbyx-ai/umbra"
Issues = "https://github.com/umbyx-ai/umbra/issues"

[project.scripts]
umbra = "umbra.cli:main"

[tool.setuptools.packages.find]
include = ["umbra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
